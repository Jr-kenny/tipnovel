<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>TipNovel review</title>
<style>
  :root { --paper: #f7f3ee; --card: #fffdf9; --ink: #2a2621; --muted: #83796f; --line: #ded5ca; --accent: #b65f47; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .claim { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .author { font-family: Georgia, serif; font-size: 20px; }
  .pill { font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .amount { font-family: Georgia, serif; font-size: 22px; margin-top: 8px; }
  .amount small { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .msg { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .shots img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
  .follow { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-size: 13px; }
  .follow img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; margin: 6px 6px 0 0; }
  .q { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button, .btn { font: 600 12px/1 -apple-system, "Segoe UI", sans-serif; border-radius: 999px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
  .approve { background: var(--accent); color: #fffaf4; border: 0; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .tx { flex: 1; min-width: 200px; font: 12px -apple-system, "Segoe UI", sans-serif; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; }
  textarea.ask { width: 100%; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; min-height: 64px; }
  .out { font-size: 12px; margin-top: 8px; word-break: break-all; }
  .out a { color: var(--accent); }
  .empty { color: var(--muted); }
  .err { color: #a8564b; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Claim review</h1>
  <div class="sub">Private. Do not share this page.</div>
  <div id="list"><p class="empty">Loading…</p></div>
</div>
<script>
(function () {
  var key = new URLSearchParams(location.search).get('key') || '';
  var list = document.getElementById('list');
  if (!key) { list.innerHTML = '<p class="err">Missing review key.</p>'; return; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mailto(email, subject, body) {
    return 'mailto:' + encodeURIComponent(email) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  }

  function approveMail(c) {
    return mailto(c.email,
      'Your TipNovel claim passed review',
      'Good news — your claim for ' + c.authorName + ' passed review.\n\n' +
      c.balanceAtSubmit + ' USDC is waiting for ' + c.payoutWallet + '.\n' +
      'Open TipNovel → Claim author tips, connect that wallet, and withdraw.');
  }

  function detailsMail(c, link, questions) {
    return mailto(c.email,
      'One more step for your TipNovel claim',
      'Thanks — to finish reviewing your claim for ' + c.authorName +
      ', please answer a few questions here:\n\n' + link +
      (questions.length ? '\n\n' + questions.map(function (q, i) { return (i + 1) + '. ' + q; }).join('\n') : ''));
  }

  function claimLink(token) {
    return location.origin + '/app/claim-update/' + encodeURIComponent(token);
  }

  function shotHtml(ev) {
    return '<a href="' + ev.dataUrl + '" target="_blank" rel="noopener"><img src="' +
      ev.dataUrl + '" alt="" loading="lazy" /></a>';
  }

  function render(claims) {
    if (!claims.length) { list.innerHTML = '<p class="empty">No claims yet.</p>'; return; }
    list.innerHTML = claims.map(function (c) {
      var shots = (c.evidence || []).map(shotHtml).join('');
      var follows = (c.followups || []).map(function (f) {
        return '<div class="follow">' + esc(f.message || '(screenshots only)') +
          '<div>' + (f.evidence || []).map(shotHtml).join('') + '</div></div>';
      }).join('');
      var qs = (c.questions || []).map(function (q) {
        return '<div class="q">Asked: ' + esc(q.text) + '</div>';
      }).join('');
      return '<article class="claim" data-id="' + esc(c.id) + '">' +
        '<div class="head"><span class="author">' + esc(c.authorName) + '</span>' +
        '<span class="pill">' + esc(c.status) + '</span></div>' +
        '<div class="amount">' + esc(c.balanceAtSubmit) + ' <small>USDC</small></div>' +
        '<div class="meta">' + esc(c.originPlatform) + ' · ' + esc(c.originUsername) + '</div>' +
        (c.originUrl ? '<div class="meta"><a href="' + esc(c.originUrl) + '" target="_blank" rel="noopener">Original page ↗</a></div>' : '') +
        '<div class="meta">' + esc(c.email) + ' · payout <span style="font-family:monospace">' + esc(c.payoutWallet) + '</span></div>' +
        (c.message ? '<div class="msg">' + esc(c.message) + '</div>' : '') +
        (shots ? '<div class="shots">' + shots + '</div>' : '') + qs + follows +
        '<textarea class="ask" placeholder="Questions for the author, one per line (for Ask for details)"></textarea>' +
        '<input class="tx" placeholder="Whitelist tx hash (optional, after you whitelist)" />' +
        '<div class="row">' +
        '<button class="approve" data-act="approve">Approve</button>' +
        '<button class="ghost" data-act="details">Ask for details</button>' +
        '<button class="ghost" data-act="reject">Reject</button>' +
        '<a class="btn ghost" data-act="mail" href="' + approveMail(c) + '">Email author</a>' +
        '</div><div class="out"></div></article>';
    }).join('');

    list.querySelectorAll('article.claim').forEach(function (card) {
      var id = card.getAttribute('data-id');
      var out = card.querySelector('.out');
      function say(html) { out.innerHTML = html; }
      card.querySelector('[data-act="approve"]').addEventListener('click', function () {
        var tx = card.querySelector('.tx').value.trim();
        post({ key: key, id: id, action: 'approve', approveTx: tx }).then(function () {
          say('Approved and recorded' + (tx ? '.' : '. Whitelist the payout wallet, then paste the tx above if you want it on record.'));
          refresh();
        }).catch(function (e) { say('<span class="err">' + esc(e.message) + '</span>'); });
      });
      card.querySelector('[data-act="reject"]').addEventListener('click', function () {
        post({ key: key, id: id, action: 'reject' }).then(refresh).catch(function (e) { say('<span class="err">' + esc(e.message) + '</span>'); });
      });
      card.querySelector('[data-act="details"]').addEventListener('click', function () {
        var questions = card.querySelector('.ask').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        var claim = current.find(function (x) { return x.id === id; });
        post({ key: key, id: id, action: 'more-info', questions: questions }).then(function (r) {
          var link = claimLink(r.token);
          say('Details link: <a href="' + link + '" target="_blank" rel="noopener">' + esc(link) + '</a><br>' +
            '<a href="' + detailsMail(claim, link, questions) + '">Email the link to the author</a>');
          refresh();
        }).catch(function (e) { say('<span class="err">' + esc(e.message) + '</span>'); });
      });
    });
  }

  var current = [];
  function post(body) {
    return fetch('/api/admin/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.json().then(function (p) {
        if (!r.ok) throw new Error((p && p.error) || 'Request failed.');
        return p;
      });
    });
  }

  function refresh() {
    fetch('/api/admin/claims?key=' + encodeURIComponent(key)).then(function (r) {
      return r.json().then(function (p) {
        if (!r.ok) throw new Error((p && p.error) || 'Request failed.');
        current = p.claims || [];
        render(current);
      });
    }).catch(function (e) {
      list.innerHTML = '<p class="err">' + esc(e.message) + '</p>';
    });
  }

  refresh();
})();
</script>
</body>
</html>
